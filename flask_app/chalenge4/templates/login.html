<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tajný Portál - CTF</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="center-body">
    <div class="login-box">
        <h2>Přihlášení</h2>
        
        {% with messages = get_flashed_messages() %}
            {% if messages %}
                {% for message in messages %}
                    <div class="info-box">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        
        <form method="POST">
            <label for="username">Uživatelské jméno:</label>
            <input type="text" id="username" name="username" required>
            
            <label for="password">Heslo:</label>
            <input type="password" id="password" name="password" required>
            
            <input type="submit" value="Vstoupit">
        </form>
        <br>
        <hr>
        <p style="text-align: center; font-size: 0.9em;">Nemáš účet?</p>
        <a href="{{ url_for('generate_user') }}" class="btn-secondary">Vygenerovat náhodný účet</a>
    </div>
</body>
</html>
