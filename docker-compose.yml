version: '3.8'

services:
  # ZDE JE TVOJE EXISTUJÍCÍ FLASK APLIKACE
  flask_web:
    build: ./flask_app
    ports:
      - "8000:8000" # Příklad existujícího portu

  # ZDE PŘIDÁVÁME NOVOU CHALLENGE
  blind_sql:
    build: ./blind_sql_challenge
    ports:
      - "9999:9999" # Zpřístupníme port 9999 z kontejneru ven na server
    environment:
      - CHALLENGE_TOKEN=KSI_ctf_session_2026
      - CHALLENGE_FLAG=KSI{59e6dc2c4205a56e80ba}
    restart: unless-stopped # Pokud by server spadl, Docker ho sám restartuje
